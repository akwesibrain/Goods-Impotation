<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Quote — Mwinbarka Imports</title>
<link rel="stylesheet" href="styles.css?v=brand23">
</head>
<body class="doc-page">
<header class="site-header">
  <div class="announce-bar">Accra desk · Landed quotes in GH₵ · Official line 054 030 9637 only</div>
  <div class="header-main container">
    <a href="index.html" class="nav-logo">
      <img src="assets/logo.png" alt="Mwinbarka Imports logo">
      <span class="logo-lockup">Mwinbarka <em>Imports</em><small>China · Turkey → Ghana</small></span>
    </a>
  </div>
</header>

<section class="section">
  <div class="container">
    <article class="doc-sheet" id="quote-sheet">
      <p class="muted">Loading quote…</p>
    </article>
    <p class="doc-actions">
      <button type="button" class="btn btn-gold" id="quote-print">Print / save PDF</button>
      <a class="btn" href="index.html">Back to the desk</a>
    </p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=brand23"></script>
<script>
function cedis(p) {
  return "GH₵ " + (Number(p || 0) / 100).toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
(async function () {
  const sheet = document.getElementById("quote-sheet");
  const token = new URLSearchParams(location.search).get("t") || "";
  const client = window.getSupabaseClient && window.getSupabaseClient();
  document.getElementById("quote-print")?.addEventListener("click", () => window.print());
  if (!client || !token) {
    sheet.innerHTML = "<h1>Quote not found.</h1><p>Ask the desk for a fresh link. Official line <strong>054 030 9637</strong>.</p>";
    return;
  }
  const { data, error } = await client.functions.invoke("public-quote", { body: { token } });
  if (error || !data || data.error || !data.quote) {
    sheet.innerHTML = "<h1>Quote not found.</h1><p>Ask the desk for a fresh link. Official line <strong>054 030 9637</strong>.</p>";
    return;
  }
  const q = data.quote;
  const items = Array.isArray(q.line_items) ? q.line_items : [];
  const itemRows = items.map((item) => {
    const qty = Number(item.qty || 1);
    const unit = Number(item.unit_pesewas || 0);
    return `<tr>
      <td>${esc(item.description || "Item")}</td>
      <td>${esc(String(qty))}</td>
      <td>${esc(cedis(unit))}</td>
      <td>${esc(cedis(qty * unit))}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="4">Landed importation</td></tr>`;
  const pay = data.pay_url
    ? `<p><a class="btn btn-gold" href="${esc(data.pay_url)}" rel="noopener">Pay with Paystack</a></p>`
    : "";
  sheet.innerHTML = `
    <header class="doc-head">
      <div>
        <span class="eyebrow">Proforma quote</span>
        <h1>${esc(q.invoice_number || "Quote")}</h1>
        <p>${esc(q.customer_name || "Customer")}${q.location ? " · " + esc(q.location) : ""}</p>
      </div>
      <p class="muted">${q.created_at ? new Date(q.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : ""}</p>
    </header>
    <table class="doc-table">
      <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead>
      <tbody>${itemRows}</tbody>
    </table>
    <dl class="doc-totals">
      <div><dt>Sea freight</dt><dd>${esc(cedis(q.freight_pesewas))}</dd></div>
      <div><dt>Duty estimate</dt><dd>${esc(cedis(q.duty_pesewas))}</dd></div>
      <div><dt>Agent fee</dt><dd>${esc(cedis(q.agent_fee_pesewas))}</dd></div>
      <div class="is-total"><dt>Total</dt><dd>${esc(cedis(q.total_pesewas))}</dd></div>
      <div><dt>Deposit</dt><dd>${esc(cedis(q.deposit_pesewas))}</dd></div>
      <div><dt>Paid</dt><dd>${esc(cedis(data.paid_pesewas))}</dd></div>
      <div><dt>Balance</dt><dd>${esc(cedis(data.balance_pesewas))}</dd></div>
    </dl>
    ${q.notes ? `<p>${esc(q.notes)}</p>` : ""}
    ${pay}
    <p>Official line: <strong>054 030 9637</strong>. Sea freight from China and Turkey to Ghana. This is not a cart — pay only the amount the desk quoted.</p>
  `;
})();
</script>
</body>
</html>
