# Static site — no build step, Netlify serves the repo root as-is.
# Netlify strips ".html" automatically, so /request, /how-it-works,
# /faq etc. resolve to the matching files.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; upgrade-insecure-requests"

[[redirects]]
  from = "/shipping"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/shipping.html"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/watch"
  to = "/"
  status = 301

[[redirects]]
  from = "/watch.html"
  to = "/"
  status = 301

# The admin desk should never show up in search results.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=86400"
