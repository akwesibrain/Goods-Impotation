<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Set a new password — Mwinbarka Imports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=brand76">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="validation.js?v=brand4"></script>
<script defer src="supabase-client.js?v=brand34"></script>
<script defer src="script.js?v=brand51"></script>
</head>
<body class="admin-app">
<section class="admin-gate">
  <form id="reset-form" class="form-card admin-gate-card" novalidate>
    <span class="eyebrow">Desk login</span>
    <h1>Set a new password</h1>
    <p>Use the link from Gmail, then choose a password you can type on this phone.</p>
    <div class="field">
      <label for="new-password">New password</label>
      <div class="password-wrap">
        <input type="password" id="new-password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        <button type="button" class="password-toggle" data-password-toggle aria-controls="new-password" aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-1.2"/><path d="M6.7 6.8C4.2 8.4 2 12 2 12s3.6 7 10 7c2 0 3.7-.5 5.1-1.3M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-3.2 3.9"/></svg>
        </button>
      </div>
    </div>
    <div class="field">
      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" name="confirm" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-gold">Save password</button>
    <div id="reset-status" class="form-status loading">Opening the reset link…</div>
    <p class="admin-gate-foot"><a href="account.html">Back to login</a></p>
  </form>
</section>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const form = document.getElementById("reset-form");
  const status = document.getElementById("reset-status");
  const client = window.getSupabaseClient && window.getSupabaseClient();
  if (typeof mountPasswordToggles === "function") mountPasswordToggles();
  if (!client) {
    status.className = "form-status error";
    status.textContent = "Account service is not connected yet.";
    return;
  }

  const waitForSession = async () => {
    for (let i = 0; i < 10; i += 1) {
      const { data } = await client.auth.getSession();
      if (data.session) return data.session;
      await new Promise((r) => setTimeout(r, 250));
    }
    return null;
  };

  const session = await waitForSession();
  if (!session) {
    status.className = "form-status error";
    status.textContent = "That reset link has expired. Go back to login and tap Forgot password.";
    form.querySelector("button[type='submit']").disabled = true;
    return;
  }
  status.className = "form-status";
  status.textContent = "Choose a new password, then save.";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = form.elements.password.value;
    const confirm = form.elements.confirm.value;
    if (password.length < 6) {
      status.className = "form-status error";
      status.textContent = "Use at least 6 characters.";
      return;
    }
    if (password !== confirm) {
      status.className = "form-status error";
      status.textContent = "The two passwords do not match.";
      return;
    }
    status.className = "form-status loading";
    status.textContent = "Saving…";
    const { error } = await client.auth.updateUser({ password });
    if (error) {
      status.className = "form-status error";
      status.textContent = error.message || "Could not save the password.";
      return;
    }
    if (window.rememberStaffPassword) window.rememberStaffPassword(password);
    status.className = "form-status success";
    status.textContent = "Password saved. Opening your desk…";
    if (window.routeSignedInUser) await window.routeSignedInUser();
    else window.location.replace("account.html");
  });
});
</script>
</body>
</html>
