<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Receipt — Mwinbarka Imports</title>
<link rel="stylesheet" href="styles.css?v=brand23">
</head>
<body class="doc-page">
<header class="site-header">
  <div class="announce-bar">Accra desk · Landed quotes in GH₵ · Official line 054 030 9637 only</div>
  <div class="header-main container">
    <a href="index.html" class="nav-logo">
      <img src="assets/logo.png" alt="Mwinbarka Imports logo">
      <span class="logo-lockup">Mwinbarka <em>Imports</em><small>China · Turkey → Ghana</small></span>
    </a>
  </div>
</header>

<section class="section">
  <div class="container">
    <article class="doc-sheet" id="receipt-sheet">
      <p class="muted">Loading receipt…</p>
    </article>
    <p class="doc-actions">
      <button type="button" class="btn btn-gold" id="receipt-print">Print / save PDF</button>
      <a class="btn" href="index.html">Back to the desk</a>
    </p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js?v=brand23"></script>
<script>
function cedis(p) {
  return "GH₵ " + (Number(p || 0) / 100).toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
(async function () {
  const sheet = document.getElementById("receipt-sheet");
  const token = new URLSearchParams(location.search).get("t") || "";
  const client = window.getSupabaseClient && window.getSupabaseClient();
  document.getElementById("receipt-print")?.addEventListener("click", () => window.print());
  if (!client || !token) {
    sheet.innerHTML = "<h1>Receipt not found.</h1><p>Official line <strong>054 030 9637</strong>.</p>";
    return;
  }
  const { data, error } = await client.functions.invoke("public-receipt", { body: { token } });
  if (error || !data || data.error || !data.receipt) {
    sheet.innerHTML = "<h1>Receipt not found.</h1><p>Official line <strong>054 030 9637</strong>.</p>";
    return;
  }
  const r = data.receipt;
  const kind = r.kind === "deposit" ? "Deposit" : r.kind === "balance" ? "Balance" : "Payment";
  const paid = r.status === "paid";
  sheet.innerHTML = `
    <header class="doc-head">
      <div>
        <span class="eyebrow">${esc(kind)}</span>
        <h1>${esc(r.invoice_number || r.reference || "Receipt")}</h1>
        <p>${esc(r.customer_name || "Customer")}</p>
      </div>
      <p class="status-pill ${paid ? "confirmed" : "quoted"}">${paid ? "Paid" : esc(r.status || "Pending")}</p>
    </header>
    <dl class="doc-totals">
      <div class="is-total"><dt>Amount</dt><dd>${esc(cedis(r.amount_pesewas))}</dd></div>
      <div><dt>Paystack reference</dt><dd>${esc(r.reference || "—")}</dd></div>
      <div><dt>Date</dt><dd>${esc((r.paid_at || r.created_at) ? new Date(r.paid_at || r.created_at).toLocaleString("en-GB") : "—")}</dd></div>
    </dl>
    <p>Mwinbarka Imports · Accra desk · Official line <strong>054 030 9637</strong>.</p>
    <p class="muted">Keep this page as proof of payment. Nothing else is charged through this website.</p>
  `;
})();
</script>
</body>
</html>
