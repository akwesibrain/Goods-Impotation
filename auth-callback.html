<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Signing in — Mwinbarka Imports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=brand84">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="supabase-client.js?v=brand36"></script>
</head>
<body class="admin-app">
<section class="admin-gate">
  <div class="form-card admin-gate-card">
    <span class="eyebrow">Desk login</span>
    <h1>Signing you in…</h1>
    <p>Hold on while we open your desk.</p>
    <div id="auth-callback-status" class="form-status loading">Checking the sign-in link…</div>
    <p class="admin-gate-foot"><a href="account.html">Back to login</a></p>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const status = document.getElementById("auth-callback-status");
  const go = window.routeSignedInUser;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  try {
    const client = window.getSupabaseClient && window.getSupabaseClient();
    if (!client || !go) throw new Error("Account service is not connected yet.");
    let session = null;
    for (let i = 0; i < 8; i += 1) {
      const { data } = await client.auth.getSession();
      session = data.session;
      if (session) break;
      await wait(250);
    }
    if (!session) throw new Error("That link has expired. Ask for a new sign-in link.");
    await go();
  } catch (err) {
    status.className = "form-status error";
    status.textContent = err.message || "Could not finish sign-in.";
  }
});
</script>
</body>
</html>
